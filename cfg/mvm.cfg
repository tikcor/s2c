// s2c moviemaking cfg: put it in your moviemaking folder's cfg folder, then exec mvm.cfg (or +exec mvm.cfg at launch).

// Game displays that get in the way.
r_show_build_info false
spec_show_xray 0
sv_grenade_trajectory 0
cl_trueview_show_status 0
cl_demo_predict 2

// Keys s2c uses (so they don't do two things at once).
unbind "1"
unbind "2"
unbind "3"
unbind "4"
unbind "5"
unbind "6"
unbind "7"
unbind "8"
unbind "9"
unbind "0"
